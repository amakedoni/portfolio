<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sword — Alternating Strikes v11</title>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Space+Mono:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--ink:#111;--line:#d0d0d0;--display:'Pirata One',serif;--mono:'Space Mono',monospace;--sans:'Poppins',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);padding:40px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}

.hero-row{display:flex;align-items:center;gap:60px}
.hero-text h1{font-family:var(--display);font-size:clamp(3rem,7vw,5.5rem);line-height:.95;letter-spacing:-2px}
.hero-text h1 .row{display:block}
.hero-text h1 .accent{display:inline-block;background:linear-gradient(45deg,#111,#555,#111);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 12s ease infinite}
@keyframes shift{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}

.stage{width:170px;height:185px;position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:visible}

/* ====== SWORD GROUP — pivot at grip ====== */
.sword-group{
  transform-origin:50% 78%;
  animation:swordTimeline 8s 1.6s cubic-bezier(.22,.61,.36,1) infinite;
}
.sword-svg{width:44px;height:130px;display:block}

/* ====== FORGE ENTRANCE ====== */
.forge-shell{animation:forgeReveal 1.4s cubic-bezier(.65,0,.35,1) forwards}
@keyframes forgeReveal{0%{clip-path:inset(0 0 100% 0)}100%{clip-path:inset(0 0 0 0)}}

/* ====== 8s TIMELINE — alternating strikes ====== */
@keyframes swordTimeline{
  /* ── STRIKE 1: OVERHAND (сверху вниз) ── */
  0%,3%{transform:rotate(0deg)}
  8%{transform:rotate(-38deg)}        /* windup: занос назад-вверх */
  15%{transform:rotate(55deg)}        /* SLASH: удар сверху */
  19%{transform:rotate(64deg)}        /* follow-through */
  22%{transform:rotate(46deg)}        /* recoil */
  25%{transform:rotate(54deg)}        /* secondary bounce */
  30%{transform:rotate(-3deg)}        /* return */
  37%{transform:rotate(1deg)}
  44%,50%{transform:rotate(0deg)}     /* guard */

  /* ── STRIKE 2: UPPERCUT (снизу вверх) ── */
  53%{transform:rotate(0deg)}
  58%{transform:rotate(32deg)}        /* windup: занос вниз-вперёд */
  65%{transform:rotate(-52deg)}       /* SLASH: удар снизу */
  69%{transform:rotate(-60deg)}       /* follow-through */
  72%{transform:rotate(-42deg)}       /* recoil */
  75%{transform:rotate(-50deg)}       /* secondary bounce */
  80%{transform:rotate(4deg)}         /* return */
  87%{transform:rotate(-1deg)}
  94%,100%{transform:rotate(0deg)}    /* guard */
}

/* ====== SHADOW & GLINT ====== */
.sword-svg{
  animation:shadowBreathe 8s 1.6s ease-in-out infinite, glintFlash 8s 1.6s ease-in-out infinite;
}
@keyframes shadowBreathe{
  0%,3%{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.15)) brightness(1)}
  15%{filter:drop-shadow(10px 10px 0 rgba(0,0,0,.35)) brightness(1.05)}
  30%{filter:drop-shadow(5px 5px 0 rgba(0,0,0,.2)) brightness(1)}
  44%,50%{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.15)) brightness(1)}
  53%{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.15)) brightness(1)}
  65%{filter:drop-shadow(-8px -8px 0 rgba(0,0,0,.35)) brightness(1.05)}
  80%{filter:drop-shadow(5px 5px 0 rgba(0,0,0,.2)) brightness(1)}
  94%,100%{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.15)) brightness(1)}
}
@keyframes glintFlash{
  0%,80%{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.15)) brightness(1)}
  83%{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.25)) brightness(1.4)}
  86%{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.15)) brightness(1)}
  100%{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.15)) brightness(1)}
}

/* ====== SPEED LINES ====== */
.speed-line{
  position:absolute;height:3px;background:var(--ink);border-radius:2px;
  opacity:0;pointer-events:none;z-index:1;transform-origin:left center;
  animation:lineFlash 8s 1.6s ease-out infinite;
}
.sl-top{width:50px;top:28px;left:58px;transform:rotate(-5deg)}
.sl-mid{width:40px;top:55px;left:62px;transform:rotate(0deg)}
.sl-bot{width:48px;top:82px;left:60px;transform:rotate(5deg)}
@keyframes lineFlash{
  /* strike 1 */
  0%,6%{opacity:0;transform:scaleX(0)}
  10%{opacity:.35;transform:scaleX(1)}
  19%{opacity:.1;transform:scaleX(.5)}
  22%{opacity:0;transform:scaleX(0)}
  /* strike 2 */
  56%{opacity:0;transform:scaleX(0)}
  60%{opacity:.35;transform:scaleX(1)}
  69%{opacity:.1;transform:scaleX(.5)}
  72%{opacity:0;transform:scaleX(0)}
  100%{opacity:0;transform:scaleX(0)}
}

/* ====== SPARKS ====== */
.spark{position:absolute;background:var(--ink);pointer-events:none;z-index:5;opacity:0}
.spark.sq{width:6px;height:6px;border-radius:1px}
.spark.rnd{width:4px;height:4px;border-radius:50%}
/* 12 sparks — each fires TWICE per 8s cycle */
.s1{top:10px;left:60px;animation:sparkBurst 8s 1.88s ease-out infinite}
.s2{top:18px;left:75px;animation:sparkBurst 8s 1.9s ease-out infinite}
.s3{top:35px;left:82px;animation:sparkBurst 8s 1.92s ease-out infinite}
.s4{top:55px;left:86px;animation:sparkBurst 8s 1.94s ease-out infinite}
.s5{top:70px;left:84px;animation:sparkBurst 8s 1.96s ease-out infinite}
.s6{top:85px;left:78px;animation:sparkBurst 8s 1.98s ease-out infinite}
.s7{top:8px;left:50px;animation:sparkBurst 8s 1.89s ease-out infinite}
.s8{top:28px;left:40px;animation:sparkBurst 8s 1.91s ease-out infinite}
.s9{top:48px;left:34px;animation:sparkBurst 8s 1.93s ease-out infinite}
.sa{top:68px;left:30px;animation:sparkBurst 8s 1.95s ease-out infinite}
.sb{top:82px;left:28px;animation:sparkBurst 8s 1.97s ease-out infinite}
.sc{top:95px;left:32px;animation:sparkBurst 8s 1.99s ease-out infinite}

@keyframes sparkBurst{
  /* strike 1 */
  0%,8%{opacity:0;transform:translate(0,0) scale(0)}
  15%{opacity:1;transform:translate(var(--dx,10px),var(--dy,-12px)) scale(1)}
  22%{opacity:.5;transform:translate(calc(var(--dx,10px)*2),calc(var(--dy,-12px)*1.8)) scale(.6)}
  30%{opacity:0;transform:translate(calc(var(--dx,10px)*3),calc(var(--dy,-12px)*2.5)) scale(0)}
  /* strike 2 */
  58%{opacity:0;transform:translate(0,0) scale(0)}
  65%{opacity:1;transform:translate(calc(var(--dx,10px)*-1),calc(var(--dy,-12px)*-1)) scale(1)}
  72%{opacity:.5;transform:translate(calc(var(--dx,10px)*-2),calc(var(--dy,-12px)*-1.8)) scale(.6)}
  80%{opacity:0;transform:translate(calc(var(--dx,10px)*-3),calc(var(--dy,-12px)*-2.5)) scale(0)}
  100%{opacity:0;transform:translate(0,0) scale(0)}
}

/* ====== FORGE SPARKS ====== */
.fspark{position:absolute;width:5px;height:5px;background:var(--ink);opacity:0;pointer-events:none;z-index:5}
.fs1{top:22px;left:62px;animation:fsparkAnim .45s .5s ease-out forwards}
.fs2{top:42px;left:56px;animation:fsparkAnim .4s .7s ease-out forwards}
.fs3{top:65px;left:64px;animation:fsparkAnim .5s .9s ease-out forwards}
.fs4{top:88px;left:58px;animation:fsparkAnim .42s 1.1s ease-out forwards}
@keyframes fsparkAnim{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--fx,10px),var(--fy,-14px))}}

.status{font-family:var(--mono);font-size:.68rem;color:#888;margin-top:24px;letter-spacing:.1em;text-align:center}
</style>
</head>
<body>

<div class="hero-row">
  <div class="hero-text">
    <h1><span class="row">Engineering</span><span class="row"><span class="accent">tomorrow's</span></span><span class="row">interfaces.</span></h1>
  </div>
  <div class="stage">
    <div class="speed-line sl-top"></div>
    <div class="speed-line sl-mid"></div>
    <div class="speed-line sl-bot"></div>

    <div class="sword-group">
      <div class="forge-shell">
        <svg class="sword-svg" viewBox="0 0 44 130" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#111"/><stop offset="45%" stop-color="#444"/>
              <stop offset="55%" stop-color="#111"/><stop offset="100%" stop-color="#111"/>
            </linearGradient>
          </defs>
          <rect x="18" y="0" width="8" height="78" rx="3" fill="url(#bg)"/>
          <rect x="2" y="74" width="40" height="5" rx="2" fill="#111"/>
          <rect x="19" y="81" width="6" height="32" rx="2" fill="#111"/>
          <circle cx="22" cy="118" r="7" fill="#111"/>
        </svg>
      </div>
    </div>

    <div class="fspark fs1" style="--fx:14px;--fy:-14px"></div>
    <div class="fspark fs2" style="--fx:-10px;--fy:-16px"></div>
    <div class="fspark fs3" style="--fx:16px;--fy:-10px"></div>
    <div class="fspark fs4" style="--fx:-12px;--fy:-18px"></div>

    <div class="spark sq s1" style="--dx:18px;--dy:-20px"></div>
    <div class="spark rnd s2" style="--dx:22px;--dy:-16px"></div>
    <div class="spark sq s3" style="--dx:26px;--dy:-10px"></div>
    <div class="spark rnd s4" style="--dx:28px;--dy:-2px"></div>
    <div class="spark sq s5" style="--dx:24px;--dy:6px"></div>
    <div class="spark rnd s6" style="--dx:18px;--dy:12px"></div>
    <div class="spark sq s7" style="--dx:-16px;--dy:-18px"></div>
    <div class="spark rnd s8" style="--dx:-20px;--dy:-12px"></div>
    <div class="spark sq s9" style="--dx:-24px;--dy:-4px"></div>
    <div class="spark rnd sa" style="--dx:-22px;--dy:6px"></div>
    <div class="spark sq sb" style="--dx:-18px;--dy:14px"></div>
    <div class="spark rnd sc" style="--dx:-12px;--dy:18px"></div>
  </div>
</div>

<div class="status">КОВКА → УДАР СВЕРХУ (−38°→+55°) → УДАР СНИЗУ (+32°→−52°) → повтор / 8s</div>

</body>
</html>
