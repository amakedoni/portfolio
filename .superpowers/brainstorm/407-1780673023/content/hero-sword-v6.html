<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sword — Grand Entrance v6</title>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Space+Mono:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--ink:#111;--line:#d0d0d0;--display:'Pirata One',serif;--mono:'Space Mono',monospace;--sans:'Poppins',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);padding:40px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}

.hero-row{display:flex;align-items:center;gap:60px}
.hero-text h1{font-family:var(--display);font-size:clamp(3rem,7vw,5.5rem);line-height:.95;letter-spacing:-2px}
.hero-text h1 .row{display:block}
.hero-text h1 .accent{display:inline-block;background:linear-gradient(45deg,#111,#555,#111);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 12s ease infinite}
@keyframes shift{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}

.sword-stage{width:140px;height:160px;position:relative;display:flex;align-items:center;justify-content:center;overflow:visible}

/* SVG sword */
.sword-svg{width:44px;height:130px;position:relative;z-index:2;opacity:0;transform:scale(0);transition:none}

/* flash overlay */
.flash{position:absolute;inset:-20px;background:var(--ink);border-radius:50%;z-index:3;opacity:0;pointer-events:none;transition:none}

/* ring pulse */
.ring{position:absolute;inset:-10px;border:3px solid var(--ink);border-radius:50%;z-index:1;opacity:0;pointer-events:none;transition:none}

/* particle */
.particle{position:absolute;background:var(--ink);pointer-events:none;transition:none}

/* glint bar */
.glint-bar{position:absolute;left:0;height:4px;background:var(--bg);z-index:4;opacity:0;pointer-events:none;transition:none}

.controls{margin-top:36px;display:flex;gap:12px}
.restart-btn{font-family:var(--mono);font-size:.78rem;padding:10px 20px;border:2px solid var(--ink);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 1px rgba(0,0,0,.15);transition:all .2s ease}
.restart-btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 1px rgba(0,0,0,.25)}
.status{font-family:var(--mono);font-size:.7rem;color:#888;margin-top:12px;letter-spacing:.08em}
</style>
</head>
<body>

<div class="hero-row">
  <div class="hero-text">
    <h1><span class="row">Engineering</span><span class="row"><span class="accent">tomorrow's</span></span><span class="row">interfaces.</span></h1>
  </div>
  <div class="sword-stage" id="stage">
    <!-- ring -->
    <div class="ring" id="ring"></div>
    <!-- flash -->
    <div class="flash" id="flash"></div>
    <!-- sword SVG -->
    <svg class="sword-svg" id="sword" viewBox="0 0 44 130" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bladeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#111"/>
          <stop offset="45%" stop-color="#444"/>
          <stop offset="55%" stop-color="#111"/>
          <stop offset="100%" stop-color="#111"/>
        </linearGradient>
      </defs>
      <rect x="18" y="0" width="8" height="78" rx="3" fill="url(#bladeGrad)"/>
      <rect x="2" y="74" width="40" height="5" rx="2" fill="#111"/>
      <rect x="19" y="81" width="6" height="32" rx="2" fill="#111"/>
      <circle cx="22" cy="118" r="7" fill="#111"/>
    </svg>
    <!-- glint bar -->
    <div class="glint-bar" id="glint"></div>
    <!-- particles injected by JS -->
  </div>
</div>

<div class="controls">
  <button class="restart-btn" onclick="play()">↻ Перезапустить</button>
</div>
<div class="status" id="status">Готово</div>

<script>
const stage = document.getElementById('stage');
const sword = document.getElementById('sword');
const flash = document.getElementById('flash');
const ring = document.getElementById('ring');
const glint = document.getElementById('glint');
const status = document.getElementById('status');

/* ---- easing ---- */
const eOutQuad = t => 1 - (1-t)*(1-t);
const eInQuad = t => t*t;
const eOutBack = t => {const c1=1.70158;const c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};

function anim(dur, ease, fn){
  return new Promise(res => {
    const t0 = performance.now();
    (function tick(now){
      const t = Math.min(1, (now-t0)/dur);
      fn(ease(t), t);
      if(t<1) requestAnimationFrame(tick); else res();
    })();
  });
}

/* ---- particles ---- */
let particles = [];

function spawnParticle(cx, cy, angle, dist, size, dur){
  const el = document.createElement('div');
  el.className = 'particle';
  el.style.cssText = `left:${cx}px;top:${cy}px;width:${size}px;height:${size}px;opacity:1`;
  stage.appendChild(el);
  const p = {el, cx, cy, angle, dist, size, dur, born: performance.now()};
  particles.push(p);
  return p;
}

function updateParticles(now){
  for(let i=particles.length-1; i>=0; i--){
    const p = particles[i];
    const t = (now - p.born) / p.dur;
    if(t >= 1){p.el.remove(); particles.splice(i,1); continue;}
    const progress = eOutQuad(t);
    const d = p.dist * progress;
    const x = p.cx + Math.cos(p.angle) * d;
    const y = p.cy + Math.sin(p.angle) * d;
    p.el.style.transform = `translate(${x - p.cx}px, ${y - p.cy}px)`;
    p.el.style.opacity = 1 - progress;
    p.el.style.transform += ` scale(${1 - progress * 0.7})`;
  }
}

/* ---- main sequence ---- */
async function play(){
  // cleanup
  particles.forEach(p => p.el.remove());
  particles = [];
  cancelAnimationFrame(sword._loop || 0);

  // reset
  sword.style.opacity = '0';
  sword.style.transform = 'scale(0)';
  sword.style.filter = 'drop-shadow(4px 4px 0 rgba(0,0,0,.2))';
  flash.style.opacity = '0';
  ring.style.opacity = '0';
  ring.style.transform = 'scale(0.5)';
  glint.style.opacity = '0';

  const cx = 70, cy = 80; // center of sword area

  /* PHASE 1: particles gather — 0 → 800ms */
  status.textContent = '⚒ Искры собираются...';
  const tPhase1 = performance.now();
  for(let i=0; i<30; i++){
    const delay = Math.random() * 700;
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 50;
    const size = 3 + Math.random() * 5;
    setTimeout(() => {
      spawnParticle(cx, cy, angle, dist, size, 600 + Math.random()*400);
    }, delay);
  }

  await anim(800, t=>t, (_, rawT) => {
    updateParticles(performance.now());
  });

  /* PHASE 2: flash + ring expand — 300ms */
  status.textContent = '💥 Вспышка!';
  await anim(300, eOutQuad, t => {
    flash.style.opacity = t < 0.5 ? t*2 : 2 - t*2; // peak at 0.5
    ring.style.opacity = t < 0.5 ? t*2 : (1-t)*2;
    ring.style.transform = `scale(${0.5 + t*1.5})`;
    updateParticles(performance.now());
  });
  flash.style.opacity = '0';
  ring.style.opacity = '0';

  /* PHASE 3: sword materializes + burst particles — 800ms */
  status.textContent = '⚔ Меч является...';
  // burst particles outward
  for(let i=0; i<24; i++){
    const angle = (i/24)*Math.PI*2;
    spawnParticle(cx, cy, angle, 60+Math.random()*40, 4+Math.random()*5, 500+Math.random()*300);
  }
  await anim(800, eOutBack, t => {
    sword.style.opacity = Math.min(1, t*3);
    const s = 0.2 + 0.8 * t;
    sword.style.transform = `scale(${s})`;
    updateParticles(performance.now());
  });

  /* PHASE 4: glint sweep down the blade — 500ms */
  status.textContent = '✨ Глинт по лезвию...';
  const swordRect = sword.getBoundingClientRect();
  const stageRect = stage.getBoundingClientRect();
  const bladeTop = swordRect.top - stageRect.top + 2;
  const bladeW = 8;
  const bladeLeft = swordRect.left - stageRect.left + 18;

  glint.style.left = bladeLeft + 'px';
  glint.style.width = bladeW + 'px';

  await anim(500, eInQuad, t => {
    glint.style.top = (bladeTop + t*74) + 'px';
    glint.style.opacity = 0.7 * (1 - Math.abs(t-0.5)*2); // peak at center
    updateParticles(performance.now());
  });
  glint.style.opacity = '0';

  /* PHASE 5: settle — sword lands with final subtle pulse */
  status.textContent = 'Меч занял место ✓';
  await anim(400, eOutBack, t => {
    updateParticles(performance.now());
  });

  /* IDLE: shadow breathing + periodic glint */
  const startIdle = performance.now();
  function idleLoop(now){
    const elapsed = (now - startIdle) / 1000;
    const shadow = 4 + 1.5 * Math.sin(elapsed * 1.6);
    const alpha = 0.15 + 0.1 * Math.sin(elapsed * 1.6);
    sword.style.filter = `drop-shadow(${shadow}px ${shadow}px 0 rgba(0,0,0,${alpha}))`;

    // periodic glint every 4 seconds
    const glintPhase = (elapsed % 4) / 4;
    if(glintPhase < 0.15){
      const gt = glintPhase / 0.15;
      glint.style.opacity = 0.5 * Math.sin(gt * Math.PI);
      glint.style.top = (bladeTop + gt*74) + 'px';
    } else {
      glint.style.opacity = '0';
    }

    updateParticles(now);
    sword._loop = requestAnimationFrame(idleLoop);
  }
  requestAnimationFrame(idleLoop);
}

setTimeout(play, 300);
</script>
</body>
</html>
