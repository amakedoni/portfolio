<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sword — CSS Animation v7</title>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Space+Mono:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--ink:#111;--line:#d0d0d0;--display:'Pirata One',serif;--mono:'Space Mono',monospace;--sans:'Poppins',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);padding:40px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}

.hero-row{display:flex;align-items:center;gap:60px}
.hero-text h1{font-family:var(--display);font-size:clamp(3rem,7vw,5.5rem);line-height:.95;letter-spacing:-2px}
.hero-text h1 .row{display:block}
.hero-text h1 .accent{display:inline-block;background:linear-gradient(45deg,#111,#555,#111);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 12s ease infinite}
@keyframes shift{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}

.sword-stage{width:140px;height:160px;position:relative;display:flex;align-items:center;justify-content:center}

/* ====== FLASH RING ====== */
.flash-ring{
  position:absolute;inset:0;border-radius:50%;border:3px solid var(--ink);
  opacity:0;transform:scale(0.3);
  animation:ringBurst 3s .5s ease-out forwards;
}
@keyframes ringBurst{
  0%{opacity:1;transform:scale(0.2)}
  30%{opacity:.8;transform:scale(1.3)}
  100%{opacity:0;transform:scale(1.6)}
}

/* ====== SWORD SVG ====== */
.sword-svg{
  width:44px;height:130px;position:relative;z-index:2;
  filter:drop-shadow(4px 4px 0 rgba(0,0,0,.2));
  animation:swordEnter 1.2s .3s cubic-bezier(.16,1,.3,1) both, swordBreathe 3.5s 1.8s ease-in-out infinite, swordGlint 4s 2.5s ease-in-out infinite;
}
@keyframes swordEnter{
  0%{opacity:0;transform:translate(30px,-50px) rotate(-25deg) scale(.2)}
  55%{opacity:1;transform:translate(-4px,3px) rotate(2deg) scale(1.05)}
  75%{transform:translate(2px,-1px) rotate(-1deg) scale(.97)}
  100%{opacity:1;transform:translate(0,0) rotate(0deg) scale(1)}
}
@keyframes swordBreathe{
  0%,100%{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.18))}
  50%{filter:drop-shadow(6px 6px 0 rgba(0,0,0,.32))}
}
@keyframes swordGlint{
  0%,100%{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.18)) brightness(1)}
  48%{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.18)) brightness(1)}
  52%{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.28)) brightness(1.35)}
  56%{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.18)) brightness(1)}
}

/* ====== PARTICLES ====== */
.particle{position:absolute;background:var(--ink);border-radius:1px;pointer-events:none}
.p1{width:6px;height:6px;top:30px;left:22px;animation:pFly1 .9s .8s ease-out both}
.p2{width:5px;height:5px;top:20px;left:62px;animation:pFly2 .8s .85s ease-out both}
.p3{width:7px;height:7px;top:50px;left:18px;animation:pFly3 1s .9s ease-out both}
.p4{width:4px;height:4px;top:55px;left:66px;animation:pFly4 .75s .95s ease-out both}
.p5{width:5px;height:5px;top:70px;left:14px;animation:pFly5 .85s .88s ease-out both}
.p6{width:6px;height:6px;top:75px;left:68px;animation:pFly6 .9s .92s ease-out both}
.p7{width:4px;height:4px;top:90px;left:20px;animation:pFly7 .7s 1s ease-out both}
.p8{width:5px;height:5px;top:95px;left:64px;animation:pFly8 .8s 1.05s ease-out both}

@keyframes pFly1{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(-18px,-22px) scale(.2)}}
@keyframes pFly2{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(16px,-18px) scale(.2)}}
@keyframes pFly3{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(-14px,14px) scale(.2)}}
@keyframes pFly4{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(20px,12px) scale(.2)}}
@keyframes pFly5{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(-20px,8px) scale(.2)}}
@keyframes pFly6{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(22px,-8px) scale(.2)}}
@keyframes pFly7{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(-16px,18px) scale(.2)}}
@keyframes pFly8{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(18px,20px) scale(.2)}}

/* ====== GLINT SWEEP ====== */
.glint-line{
  position:absolute;left:50%;transform:translateX(-50%);width:8px;height:0;background:var(--bg);
  z-index:4;pointer-events:none;top:20px;opacity:0;
  animation:glintSweep 4s 2.5s ease-in-out infinite;
}
@keyframes glintSweep{
  0%{opacity:0;height:0;top:20px}
  5%{opacity:.7;height:4px;top:20px}
  25%{opacity:.7;height:4px;top:90px}
  30%{opacity:0;height:0;top:94px}
  100%{opacity:0;height:0;top:94px}
}

.controls{margin-top:36px}
.restart-btn{font-family:var(--mono);font-size:.78rem;padding:10px 20px;border:2px solid var(--ink);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 1px rgba(0,0,0,.15);transition:all .2s ease}
.restart-btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 1px rgba(0,0,0,.25)}
.status{font-family:var(--mono);font-size:.7rem;color:#888;margin-top:12px;letter-spacing:.08em}
</style>
</head>
<body>

<div class="hero-row">
  <div class="hero-text">
    <h1><span class="row">Engineering</span><span class="row"><span class="accent">tomorrow's</span></span><span class="row">interfaces.</span></h1>
  </div>
  <div class="sword-stage">
    <!-- ring -->
    <div class="flash-ring"></div>
    <!-- glint -->
    <div class="glint-line"></div>
    <!-- sword -->
    <svg class="sword-svg" viewBox="0 0 44 130" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bladeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#111"/>
          <stop offset="45%" stop-color="#444"/>
          <stop offset="55%" stop-color="#111"/>
          <stop offset="100%" stop-color="#111"/>
        </linearGradient>
      </defs>
      <rect x="18" y="0" width="8" height="78" rx="3" fill="url(#bladeGrad)"/>
      <rect x="2" y="74" width="40" height="5" rx="2" fill="#111"/>
      <rect x="19" y="81" width="6" height="32" rx="2" fill="#111"/>
      <circle cx="22" cy="118" r="7" fill="#111"/>
    </svg>
    <!-- particles -->
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <div class="particle p6"></div>
    <div class="particle p7"></div>
    <div class="particle p8"></div>
  </div>
</div>

<div class="controls">
  <button class="restart-btn" onclick="location.reload()">↻ Перезапустить (F5)</button>
</div>
<div class="status">Меч является: вход с bounce, кольцо расходится, 8 частиц разлетаются, глинт бежит по лезвию каждые 4s, тень дышит</div>

</body>
</html>
