<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sword — Overhand + Uppercut v14</title>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Space+Mono:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--ink:#111;--line:#d0d0d0;--display:'Pirata One',serif;--mono:'Space Mono',monospace;--sans:'Poppins',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);padding:40px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}

.hero-row{display:flex;align-items:center;gap:60px}
.hero-text h1{font-family:var(--display);font-size:clamp(3rem,7vw,5.5rem);line-height:.95;letter-spacing:-2px}
.hero-text h1 .row{display:block}
.hero-text h1 .accent{display:inline-block;background:linear-gradient(45deg,#111,#555,#111);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 12s ease infinite}
@keyframes shift{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}

.stage{width:170px;height:185px;position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:visible}

/* ====== SWORD ====== */
.sword-group{transform-origin:50% 78%;animation:swordTimeline 7s 1.6s linear infinite}
.sword-svg{width:44px;height:130px;display:block}

/* ====== FORGE ====== */
.forge-shell{animation:forgeReveal 1.4s cubic-bezier(.65,0,.35,1) forwards}
@keyframes forgeReveal{0%{clip-path:inset(0 0 100% 0)}100%{clip-path:inset(0 0 0 0)}}

/* ====== 7s TIMELINE ====== */
@keyframes swordTimeline{
  /* ── STRIKE 1: OVERHAND (замах влево → удар вправо-вниз) ── */
  0%,2%{transform:rotate(0deg)}
  4%{transform:rotate(-3deg)}
  7%{transform:rotate(-12deg)}
  10%{transform:rotate(-28deg)}
  13%{transform:rotate(-40deg)}       /* windup: занос назад */
  16%{transform:rotate(-22deg)}
  19%{transform:rotate(15deg)}
  21%{transform:rotate(44deg)}        /* SLASH peak */
  23%{transform:rotate(56deg)}
  25%{transform:rotate(62deg)}        /* follow-through */
  27%{transform:rotate(48deg)}        /* recoil */
  29%{transform:rotate(54deg)}        /* bounce */
  32%{transform:rotate(18deg)}
  36%{transform:rotate(-4deg)}
  40%{transform:rotate(1deg)}
  44%,48%{transform:rotate(0deg)}     /* guard */

  /* ── STRIKE 2: UPPERCUT (замах вниз → подъём вверх) ── */
  50%,52%{transform:rotate(0deg)}
  55%{transform:rotate(5deg)}
  58%{transform:rotate(15deg)}
  61%{transform:rotate(28deg)}
  64%{transform:rotate(40deg)}        /* windup: клинок опущен вправо-вниз */
  67%{transform:rotate(28deg)}
  70%{transform:rotate(12deg)}
  72%{transform:rotate(-8deg)}        /* SLASH: клинок идёт вверх */
  74%{transform:rotate(-18deg)}       /* peak: клинок прошёл вертикаль */
  76%{transform:rotate(-12deg)}       /* recoil */
  78%{transform:rotate(-20deg)}       /* bounce */
  81%{transform:rotate(-5deg)}
  85%{transform:rotate(4deg)}
  89%{transform:rotate(-1deg)}
  93%,96%{transform:rotate(0deg)}     /* guard */
  100%{transform:rotate(0deg)}
}

/* ====== SHADOW ====== */
.sword-svg{animation:shadowTimeline 7s 1.6s linear infinite}
@keyframes shadowTimeline{
  0%,2%{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.15)) brightness(1)}
  /* S1 */
  13%{filter:drop-shadow(7px 7px 0 rgba(0,0,0,.25)) brightness(1)}
  21%{filter:drop-shadow(11px 11px 0 rgba(0,0,0,.38)) brightness(1.06)}
  29%{filter:drop-shadow(7px 7px 0 rgba(0,0,0,.2)) brightness(1)}
  40%{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.15)) brightness(1)}
  44%,50%{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.15)) brightness(1)}
  /* S2 — shadow goes UP-RIGHT as blade rises */
  64%{filter:drop-shadow(6px 8px 0 rgba(0,0,0,.25)) brightness(1)}
  74%{filter:drop-shadow(2px 10px 0 rgba(0,0,0,.38)) brightness(1.06)}
  85%{filter:drop-shadow(4px 6px 0 rgba(0,0,0,.2)) brightness(1)}
  93%,100%{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.15)) brightness(1)}
}

/* ====== SPEED LINES ====== */
.speed-line{position:absolute;height:3px;background:var(--ink);border-radius:2px;opacity:0;pointer-events:none;z-index:1;transform-origin:left center}
/* S1: horizontal-ish lines */
.sl1{width:50px;top:26px;left:54px;transform:rotate(-8deg);animation:sl1 7s 1.6s linear infinite}
.sl2{width:42px;top:54px;left:58px;transform:rotate(0deg);animation:sl2 7s 1.6s linear infinite}
.sl3{width:48px;top:82px;left:56px;transform:rotate(8deg);animation:sl1 7s 1.6s linear infinite}
/* S2: upward-curved lines */
.sl4{width:40px;top:60px;left:64px;transform:rotate(-35deg);animation:slUp1 7s 1.6s linear infinite}
.sl5{width:35px;top:40px;left:68px;transform:rotate(-25deg);animation:slUp2 7s 1.6s linear infinite}
.sl6{width:38px;top:20px;left:66px;transform:rotate(-15deg);animation:slUp1 7s 1.6s linear infinite}

@keyframes sl1{0%,7%{opacity:0;transform:scaleX(0)}12%{opacity:.3;transform:scaleX(1)}23%{opacity:0;transform:scaleX(0)}50%,100%{opacity:0}}
@keyframes sl2{0%,7%{opacity:0;transform:scaleX(0)}11%{opacity:.35;transform:scaleX(1)}22%{opacity:0;transform:scaleX(0)}50%,100%{opacity:0}}
@keyframes slUp1{0%,57%{opacity:0;transform:scaleX(0)}62%{opacity:.3;transform:scaleX(1)}74%{opacity:0;transform:scaleX(0)}100%{opacity:0}}
@keyframes slUp2{0%,57%{opacity:0;transform:scaleX(0)}61%{opacity:.35;transform:scaleX(1)}73%{opacity:0;transform:scaleX(0)}100%{opacity:0}}

/* ====== SPARKS ====== */
.spark{position:absolute;background:var(--ink);pointer-events:none;z-index:5;opacity:0}
.spark.sq{width:6px;height:6px;border-radius:1px}
.spark.rnd{width:4px;height:4px;border-radius:50%}

/* S1 sparks: fly right-down */
.sa{top:10px;left:62px;animation:spS1 7s 1.86s linear infinite}
.sb{top:22px;left:78px;animation:spS1 7s 1.88s linear infinite}
.sc{top:45px;left:86px;animation:spS1 7s 1.9s linear infinite}
.sd{top:68px;left:84px;animation:spS1 7s 1.92s linear infinite}
.se{top:88px;left:74px;animation:spS1 7s 1.94s linear infinite}
.sf{top:8px;left:46px;animation:spS1 7s 1.87s linear infinite}
.sg{top:28px;left:32px;animation:spS1 7s 1.89s linear infinite}
.sh{top:52px;left:26px;animation:spS1 7s 1.91s linear infinite}

/* S2 sparks: fly UP-right */
.si{top:75px;left:58px;animation:spS2 7s 4.72s linear infinite}
.sj{top:65px;left:70px;animation:spS2 7s 4.74s linear infinite}
.sk{top:50px;left:78px;animation:spS2 7s 4.76s linear infinite}
.sl{top:35px;left:80px;animation:spS2 7s 4.78s linear infinite}
.sm{top:20px;left:76px;animation:spS2 7s 4.8s linear infinite}
.sn{top:80px;left:44px;animation:spS2 7s 4.73s linear infinite}
.so{top:60px;left:36px;animation:spS2 7s 4.75s linear infinite}
.sp{top:40px;left:30px;animation:spS2 7s 4.77s linear infinite}

@keyframes spS1{
  0%,8%{opacity:0;transform:translate(0,0) scale(0)}
  16%{opacity:1;transform:translate(var(--dx,12px),var(--dy,-14px)) scale(1)}
  25%{opacity:.4;transform:translate(calc(var(--dx,12px)*2.3),calc(var(--dy,-14px)*2.2)) scale(.5)}
  38%{opacity:0;transform:translate(calc(var(--dx,12px)*4),calc(var(--dy,-14px)*3.5)) scale(0)}
  50%,100%{opacity:0}
}
@keyframes spS2{
  0%,60%{opacity:0;transform:translate(0,0) scale(0)}
  69%{opacity:1;transform:translate(var(--ux,10px),var(--uy,-18px)) scale(1)}
  78%{opacity:.4;transform:translate(calc(var(--ux,10px)*2.3),calc(var(--uy,-18px)*2.2)) scale(.5)}
  90%{opacity:0;transform:translate(calc(var(--ux,10px)*4),calc(var(--uy,-18px)*3.5)) scale(0)}
  100%{opacity:0}
}

/* ====== FORGE SPARKS ====== */
.fspark{position:absolute;width:5px;height:5px;background:var(--ink);opacity:0;pointer-events:none;z-index:5}
.fs1{top:22px;left:62px;animation:fsparkAnim .45s .5s ease-out forwards}
.fs2{top:42px;left:56px;animation:fsparkAnim .4s .7s ease-out forwards}
.fs3{top:65px;left:64px;animation:fsparkAnim .5s .9s ease-out forwards}
.fs4{top:88px;left:58px;animation:fsparkAnim .42s 1.1s ease-out forwards}
@keyframes fsparkAnim{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--fx,10px),var(--fy,-14px))}}

.indicator{font-family:var(--mono);font-size:.62rem;letter-spacing:.15em;margin-top:20px;text-align:center}
.indicator span{padding:6px 14px;border:2px solid var(--ink);border-radius:4px;display:inline-block}
.indicator .s1label{animation:s1glow 7s 1.6s linear infinite}
.indicator .s2label{animation:s2glow 7s 1.6s linear infinite}
@keyframes s1glow{0%,10%{background:transparent;color:var(--ink)}13%,25%{background:var(--ink);color:var(--bg)}30%,50%{background:transparent;color:var(--ink)}100%{background:transparent;color:var(--ink)}}
@keyframes s2glow{0%,57%{background:transparent;color:var(--ink)}60%,80%{background:var(--ink);color:var(--bg)}85%,100%{background:transparent;color:var(--ink)}}
</style>
</head>
<body>

<div class="hero-row">
  <div class="hero-text">
    <h1><span class="row">Engineering</span><span class="row"><span class="accent">tomorrow's</span></span><span class="row">interfaces.</span></h1>
  </div>
  <div class="stage">
    <!-- S1 speed lines (horizontal) -->
    <div class="speed-line sl1"></div>
    <div class="speed-line sl2"></div>
    <div class="speed-line sl3"></div>
    <!-- S2 speed lines (upward) -->
    <div class="speed-line sl4"></div>
    <div class="speed-line sl5"></div>
    <div class="speed-line sl6"></div>

    <div class="sword-group">
      <div class="forge-shell">
        <svg class="sword-svg" viewBox="0 0 44 130" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#111"/><stop offset="45%" stop-color="#444"/>
              <stop offset="55%" stop-color="#111"/><stop offset="100%" stop-color="#111"/>
            </linearGradient>
          </defs>
          <rect x="18" y="0" width="8" height="78" rx="3" fill="url(#bg)"/>
          <rect x="2" y="74" width="40" height="5" rx="2" fill="#111"/>
          <rect x="19" y="81" width="6" height="32" rx="2" fill="#111"/>
          <circle cx="22" cy="118" r="7" fill="#111"/>
        </svg>
      </div>
    </div>

    <div class="fspark fs1" style="--fx:14px;--fy:-14px"></div>
    <div class="fspark fs2" style="--fx:-10px;--fy:-16px"></div>
    <div class="fspark fs3" style="--fx:16px;--fy:-10px"></div>
    <div class="fspark fs4" style="--fx:-12px;--fy:-18px"></div>

    <!-- S1 sparks (8) -->
    <div class="spark sq sa" style="--dx:18px;--dy:14px"></div>
    <div class="spark rnd sb" style="--dx:22px;--dy:10px"></div>
    <div class="spark sq sc" style="--dx:26px;--dy:4px"></div>
    <div class="spark rnd sd" style="--dx:24px;--dy:-4px"></div>
    <div class="spark sq se" style="--dx:16px;--dy:-10px"></div>
    <div class="spark sq sf" style="--dx:-16px;--dy:12px"></div>
    <div class="spark rnd sg" style="--dx:-22px;--dy:6px"></div>
    <div class="spark sq sh" style="--dx:-26px;--dy:-2px"></div>

    <!-- S2 sparks (8, upward) -->
    <div class="spark sq si" style="--ux:14px;--uy:-22px"></div>
    <div class="spark rnd sj" style="--ux:18px;--uy:-18px"></div>
    <div class="spark sq sk" style="--ux:22px;--uy:-12px"></div>
    <div class="spark rnd sl" style="--ux:20px;--uy:-8px"></div>
    <div class="spark sq sm" style="--ux:12px;--uy:-5px"></div>
    <div class="spark sq sn" style="--ux:-12px;--uy:-20px"></div>
    <div class="spark rnd so" style="--ux:-18px;--uy:-14px"></div>
    <div class="spark sq sp" style="--ux:-20px;--uy:-10px"></div>
  </div>
</div>

<div class="indicator">
  <span class="s1label">СВЕРХУ ↙</span>
  &nbsp;→&nbsp;
  <span class="s2label">СНИЗУ ↗</span>
</div>

</body>
</html>
