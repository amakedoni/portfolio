<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sword — Dual Strike v12</title>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Space+Mono:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--ink:#111;--line:#d0d0d0;--display:'Pirata One',serif;--mono:'Space Mono',monospace;--sans:'Poppins',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);padding:40px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}

.hero-row{display:flex;align-items:center;gap:60px}
.hero-text h1{font-family:var(--display);font-size:clamp(3rem,7vw,5.5rem);line-height:.95;letter-spacing:-2px}
.hero-text h1 .row{display:block}
.hero-text h1 .accent{display:inline-block;background:linear-gradient(45deg,#111,#555,#111);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 12s ease infinite}
@keyframes shift{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}

.stage{width:170px;height:185px;position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:visible}

/* ====== SWORD — pivot at grip ====== */
.sword-group{transform-origin:50% 78%}
.sword-svg{width:44px;height:130px;display:block}

/* ====== FORGE ====== */
.forge-shell{animation:forgeReveal 1.4s cubic-bezier(.65,0,.35,1) forwards}
@keyframes forgeReveal{0%{clip-path:inset(0 0 100% 0)}100%{clip-path:inset(0 0 0 0)}}

/* ====== STRIKE 1: OVERHAND (2.5s, starts at 1.6s) ====== */
.strike1{
  animation:s1 3s 1.6s cubic-bezier(.22,.61,.36,1) infinite;
}
@keyframes s1{
  0%,8%{transform:rotate(0deg)}
  25%{transform:rotate(-40deg)}
  50%{transform:rotate(58deg)}
  65%{transform:rotate(66deg)}
  78%{transform:rotate(44deg)}
  90%{transform:rotate(-2deg)}
  100%{transform:rotate(0deg)}
}

/* ====== STRIKE 2: UPPERCUT (2.5s, starts at 1.6+3=4.6s offset in loop) ====== */
.strike2{
  animation:s2 3s 4.6s cubic-bezier(.22,.61,.36,1) infinite;
}
@keyframes s2{
  0%,8%{transform:rotate(0deg)}
  25%{transform:rotate(35deg)}
  50%{transform:rotate(-55deg)}
  65%{transform:rotate(-64deg)}
  78%{transform:rotate(-40deg)}
  90%{transform:rotate(3deg)}
  100%{transform:rotate(0deg)}
}

/* ====== SHADOW + GLINT follow the active strike ====== */
.shadow-layer{
  animation:sh1 3s 1.6s ease-in-out infinite, sh2 3s 4.6s ease-in-out infinite;
}
@keyframes sh1{
  0%,8%{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.15)) brightness(1)}
  50%{filter:drop-shadow(10px 10px 0 rgba(0,0,0,.35)) brightness(1.06)}
  90%,100%{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.15)) brightness(1)}
}
@keyframes sh2{
  0%,8%{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.15)) brightness(1)}
  50%{filter:drop-shadow(-8px -8px 0 rgba(0,0,0,.35)) brightness(1.06)}
  90%,100%{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.15)) brightness(1)}
}

/* ====== SPEED LINES ====== */
.speed-line{position:absolute;height:3px;background:var(--ink);border-radius:2px;opacity:0;pointer-events:none;z-index:1;transform-origin:left center}
.sl1{width:50px;top:28px;left:58px;transform:rotate(-5deg);animation:slFlash1 3s 1.75s ease-out infinite,slFlash2 3s 4.75s ease-out infinite}
.sl2{width:40px;top:55px;left:62px;transform:rotate(0deg);animation:slFlash1 3s 1.78s ease-out infinite,slFlash2 3s 4.78s ease-out infinite}
.sl3{width:48px;top:82px;left:60px;transform:rotate(5deg);animation:slFlash1 3s 1.8s ease-out infinite,slFlash2 3s 4.8s ease-out infinite}
@keyframes slFlash1{0%,10%{opacity:0;transform:scaleX(0)}25%{opacity:.35;transform:scaleX(1)}55%{opacity:0;transform:scaleX(0)}100%{opacity:0}}
@keyframes slFlash2{0%,10%{opacity:0;transform:scaleX(0)}25%{opacity:.35;transform:scaleX(1)}55%{opacity:0;transform:scaleX(0)}100%{opacity:0}}

/* ====== SPARKS ====== */
.spark{position:absolute;background:var(--ink);pointer-events:none;z-index:5;opacity:0}
.spark.sq{width:6px;height:6px;border-radius:1px}
.spark.rnd{width:4px;height:4px;border-radius:50%}

/* first 6 sparks fire on BOTH strikes */
.sa{top:10px;left:62px;animation:spBurst1 3s 1.88s ease-out infinite,spBurst2 3s 4.88s ease-out infinite}
.sb{top:25px;left:78px;animation:spBurst1 3s 1.9s ease-out infinite,spBurst2 3s 4.9s ease-out infinite}
.sc{top:50px;left:86px;animation:spBurst1 3s 1.92s ease-out infinite,spBurst2 3s 4.92s ease-out infinite}
.sd{top:70px;left:84px;animation:spBurst1 3s 1.94s ease-out infinite,spBurst2 3s 4.94s ease-out infinite}
.se{top:88px;left:76px;animation:spBurst1 3s 1.96s ease-out infinite,spBurst2 3s 4.96s ease-out infinite}
.sf{top:8px;left:48px;animation:spBurst1 3s 1.89s ease-out infinite,spBurst2 3s 4.89s ease-out infinite}
.sg{top:30px;left:34px;animation:spBurst1 3s 1.91s ease-out infinite,spBurst2 3s 4.91s ease-out infinite}
.sh{top:55px;left:28px;animation:spBurst1 3s 1.93s ease-out infinite,spBurst2 3s 4.93s ease-out infinite}
.si{top:78px;left:26px;animation:spBurst1 3s 1.95s ease-out infinite,spBurst2 3s 4.95s ease-out infinite}
.sj{top:95px;left:30px;animation:spBurst1 3s 1.97s ease-out infinite,spBurst2 3s 4.97s ease-out infinite}

@keyframes spBurst1{0%,12%{opacity:0;transform:translate(0,0) scale(0)}30%{opacity:1;transform:translate(var(--dx,12px),var(--dy,-14px)) scale(1)}48%{opacity:.4;transform:translate(calc(var(--dx,12px)*2.2),calc(var(--dy,-14px)*2)) scale(.5)}70%{opacity:0;transform:translate(calc(var(--dx,12px)*3.5),calc(var(--dy,-14px)*3)) scale(0)}100%{opacity:0}}
@keyframes spBurst2{0%,12%{opacity:0;transform:translate(0,0) scale(0)}30%{opacity:1;transform:translate(calc(var(--dx,12px)*-1),calc(var(--dy,-14px)*-1)) scale(1)}48%{opacity:.4;transform:translate(calc(var(--dx,12px)*-2.2),calc(var(--dy,-14px)*-2)) scale(.5)}70%{opacity:0;transform:translate(calc(var(--dx,12px)*-3.5),calc(var(--dy,-14px)*-3)) scale(0)}100%{opacity:0}}

/* ====== FORGE SPARKS ====== */
.fspark{position:absolute;width:5px;height:5px;background:var(--ink);opacity:0;pointer-events:none;z-index:5}
.fs1{top:22px;left:62px;animation:fsparkAnim .45s .5s ease-out forwards}
.fs2{top:42px;left:56px;animation:fsparkAnim .4s .7s ease-out forwards}
.fs3{top:65px;left:64px;animation:fsparkAnim .5s .9s ease-out forwards}
.fs4{top:88px;left:58px;animation:fsparkAnim .42s 1.1s ease-out forwards}
@keyframes fsparkAnim{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--fx,10px),var(--fy,-14px))}}

.indicator{font-family:var(--mono);font-size:.62rem;letter-spacing:.15em;margin-top:20px;text-align:center}
.indicator .tag{display:inline-block;padding:6px 14px;border:2px solid var(--ink);border-radius:4px;animation:tagPulse 6s 1.6s ease-in-out infinite}
@keyframes tagPulse{
  0%,45%{background:transparent;color:var(--ink)}
  50%,95%{background:var(--ink);color:var(--bg)}
  100%{background:transparent;color:var(--ink)}
}
</style>
</head>
<body>

<div class="hero-row">
  <div class="hero-text">
    <h1><span class="row">Engineering</span><span class="row"><span class="accent">tomorrow's</span></span><span class="row">interfaces.</span></h1>
  </div>
  <div class="stage">
    <div class="speed-line sl1"></div>
    <div class="speed-line sl2"></div>
    <div class="speed-line sl3"></div>

    <!-- TWO layers: one for each strike. Both apply to the same visual sword via CSS animation on separate wrapper divs -->
    <div class="strike1">
    <div class="strike2">
      <div class="forge-shell">
        <div class="shadow-layer">
          <svg class="sword-svg" viewBox="0 0 44 130" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#111"/><stop offset="45%" stop-color="#444"/>
                <stop offset="55%" stop-color="#111"/><stop offset="100%" stop-color="#111"/>
              </linearGradient>
            </defs>
            <rect x="18" y="0" width="8" height="78" rx="3" fill="url(#bg)"/>
            <rect x="2" y="74" width="40" height="5" rx="2" fill="#111"/>
            <rect x="19" y="81" width="6" height="32" rx="2" fill="#111"/>
            <circle cx="22" cy="118" r="7" fill="#111"/>
          </svg>
        </div>
      </div>
    </div>
    </div>

    <div class="fspark fs1" style="--fx:14px;--fy:-14px"></div>
    <div class="fspark fs2" style="--fx:-10px;--fy:-16px"></div>
    <div class="fspark fs3" style="--fx:16px;--fy:-10px"></div>
    <div class="fspark fs4" style="--fx:-12px;--fy:-18px"></div>

    <div class="spark sq sa" style="--dx:18px;--dy:-20px"></div>
    <div class="spark rnd sb" style="--dx:22px;--dy:-16px"></div>
    <div class="spark sq sc" style="--dx:26px;--dy:-8px"></div>
    <div class="spark rnd sd" style="--dx:24px;--dy:4px"></div>
    <div class="spark sq se" style="--dx:16px;--dy:14px"></div>
    <div class="spark sq sf" style="--dx:-15px;--dy:-18px"></div>
    <div class="spark rnd sg" style="--dx:-20px;--dy:-10px"></div>
    <div class="spark sq sh" style="--dx:-24px;--dy:0px"></div>
    <div class="spark rnd si" style="--dx:-18px;--dy:10px"></div>
    <div class="spark sq sj" style="--dx:-10px;--dy:18px"></div>
  </div>
</div>

<div class="indicator"><span class="tag">СВЕРХУ</span> &nbsp;→&nbsp; <span class="tag">СНИЗУ</span> &nbsp; цикл 6s</div>

</body>
</html>
