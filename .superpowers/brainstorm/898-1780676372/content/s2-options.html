<style>
:root { --ink: #111; --bg: #fafafa; }

.row3 { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }

.demo-wrap {
  display: flex; flex-direction: column; align-items: center;
  gap: 6px; flex: 1; min-width: 130px; max-width: 160px;
}
.demo-stage {
  width: 120px; height: 150px;
  position: relative;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid #ddd; border-radius: 6px;
  background: #fafafa;
  overflow: visible;
}
.demo-label {
  font-size: .72rem; letter-spacing: .1em; text-transform: uppercase;
  font-family: monospace; text-align: center; color: #555;
  line-height: 1.4;
}

/* ── shared sword SVG ── */
.sw {
  width: 36px; height: 108px;
  position: relative; z-index: 2;
  transform-origin: 50% 78%;
}

/* ── speed lines ── */
.sl {
  position: absolute; height: 2px; background: #111;
  border-radius: 2px; opacity: 0; pointer-events: none;
}

/* ══════════════════════════════════════
   CURRENT — double bounce
══════════════════════════════════════ */
@keyframes sw-current {
  0%,5%   { transform: translate(0,0) rotate(0deg) }
  12%     { transform: translate(2px,12px) rotate(14deg) }
  20%     { transform: translate(5px,26px) rotate(36deg) }
  28%     { transform: translate(6px,38px) rotate(52deg) }   /* windup */
  36%     { transform: translate(-1px,2px) rotate(8deg) }    /* slash */
  42%     { transform: translate(-4px,-26px) rotate(-20deg) } /* peak */
  46%     { transform: translate(-3px,-20px) rotate(-16deg) }
  52%     { transform: translate(-1px,-9px) rotate(-8deg) }
  58%     { transform: translate(-2px,-14px) rotate(-18deg) } /* double bounce ← */
  64%     { transform: translate(0,2px) rotate(-5deg) }
  72%     { transform: translate(1px,-2px) rotate(2deg) }
  82%,100%{ transform: translate(0,0) rotate(0deg) }
}
@keyframes sl-current-up {
  0%,38%  { opacity:0; transform:rotate(-52deg) scaleX(0) }
  46%     { opacity:.35; transform:rotate(-52deg) scaleX(1) }
  58%     { opacity:0; transform:rotate(-52deg) scaleX(0) }
  100%    { opacity:0 }
}

/* ══════════════════════════════════════
   OPTION A — fixed recoil, same motion
══════════════════════════════════════ */
@keyframes sw-a {
  0%,5%   { transform: translate(0,0) rotate(0deg) }
  14%     { transform: translate(2px,12px) rotate(14deg) }
  22%     { transform: translate(5px,26px) rotate(36deg) }
  30%     { transform: translate(6px,38px) rotate(52deg) }   /* windup */
  37%     { transform: translate(-1px,2px) rotate(8deg) }    /* slash */
  43%     { transform: translate(-4px,-26px) rotate(-20deg) } /* peak */
  48%     { transform: translate(-2px,-14px) rotate(-10deg) } /* recoil — smooth */
  55%     { transform: translate(1px,-4px) rotate(3deg) }
  62%     { transform: translate(0,1px) rotate(-1deg) }
  74%,100%{ transform: translate(0,0) rotate(0deg) }
}
@keyframes sl-a-up {
  0%,38%  { opacity:0; transform:rotate(-52deg) scaleX(0) }
  46%     { opacity:.38; transform:rotate(-52deg) scaleX(1) }
  56%     { opacity:0; transform:rotate(-52deg) scaleX(0) }
  100%    { opacity:0 }
}

/* ══════════════════════════════════════
   OPTION B — lateral windup (drop right, sweep up-left)
══════════════════════════════════════ */
@keyframes sw-b {
  0%,5%   { transform: translate(0,0) rotate(0deg) }
  /* windup: sword drops to the RIGHT side, blade forward */
  14%     { transform: translate(4px,6px) rotate(20deg) }
  22%     { transform: translate(10px,14px) rotate(48deg) }
  28%     { transform: translate(12px,18px) rotate(68deg) } /* far right windup */
  /* slash: wide sweep from right to upper-left */
  35%     { transform: translate(6px,6px) rotate(38deg) }
  41%     { transform: translate(-2px,-8px) rotate(-2deg) }
  45%     { transform: translate(-6px,-22px) rotate(-24deg) } /* peak */
  /* recoil */
  50%     { transform: translate(-4px,-14px) rotate(-14deg) }
  57%     { transform: translate(-1px,-3px) rotate(-3deg) }
  66%,100%{ transform: translate(0,0) rotate(0deg) }
}
@keyframes sl-b-up {
  0%,38%  { opacity:0; transform:rotate(-60deg) scaleX(0) }
  46%     { opacity:.38; transform:rotate(-60deg) scaleX(1) }
  56%     { opacity:0; transform:rotate(-60deg) scaleX(0) }
  100%    { opacity:0 }
}

/* ══════════════════════════════════════
   OPTION C — rising thrust (straight up)
══════════════════════════════════════ */
@keyframes sw-c {
  0%,5%   { transform: translate(0,0) rotate(0deg) }
  /* windup: sword tips back (rotate negative = lean back) */
  14%     { transform: translate(0,8px) rotate(8deg) }
  22%     { transform: translate(2px,20px) rotate(18deg) }
  28%     { transform: translate(3px,28px) rotate(22deg) } /* low & tilted forward slightly */
  /* slash: drives straight up */
  34%     { transform: translate(1px,12px) rotate(10deg) }
  39%     { transform: translate(-1px,-6px) rotate(-4deg) }
  43%     { transform: translate(-2px,-28px) rotate(-10deg) } /* peak — almost vertical */
  /* recoil */
  48%     { transform: translate(-1px,-16px) rotate(-6deg) }
  55%     { transform: translate(0,-4px) rotate(-2deg) }
  64%,100%{ transform: translate(0,0) rotate(0deg) }
}
@keyframes sl-c-up {
  0%,38%  { opacity:0; transform:rotate(-78deg) scaleX(0) }
  46%     { opacity:.38; transform:rotate(-78deg) scaleX(1) }
  56%     { opacity:0; transform:rotate(-78deg) scaleX(0) }
  100%    { opacity:0 }
}
</style>
