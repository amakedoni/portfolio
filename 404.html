<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="404_title">404 — Страница не найдена | Alexander Makedonskiy</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/webp" sizes="512x512" href="/assets/images/favicon.webp">
  <link rel="stylesheet" href="/css/site.css">
  <script src="/js/translations.js"></script>
  <script src="/js/lang.js"></script>
  <script src="/js/theme.js"></script>
  <style>
    .lost{min-height:100vh;min-height:100lvh;display:grid;place-items:center;text-align:center;padding:84px var(--gut) 40px}
    .lost-core{display:grid;justify-items:center;gap:clamp(14px,2.4lvh,26px)}
    .lost-code{display:flex;align-items:center;justify-content:center;font:400 min(58vw,50lvh)/1 var(--display)}
    .lost-code .sticker{width:.78em;height:.78em;max-width:none;margin-inline:.02em}
    .lost-title{font:400 clamp(38px,5vw,76px)/1 var(--display);text-transform:uppercase}
    .lost-desc{max-width:52ch}
    .lost-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
    .lost-bar{position:fixed;top:12px;right:12px;z-index:60;display:flex;gap:6px;padding:6px;background:#000;color:#fff;border-radius:6px}
    .lost-bar .theme-toggle{height:32px}
    .lost-brand{position:fixed;top:24px;left:18px;z-index:60;font:400 24px/1 var(--serif);letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
  </style>
</head>
<body class="dark-theme">
  <a class="lost-brand" href="/">A. Makedonskiy</a>
  <div class="lost-bar">
    <button class="lang-toggle" type="button" data-i18n="aria_lang" aria-label="Переключить язык"><span class="lang-text">RU</span></button>
    <button class="theme-toggle" type="button" data-i18n="aria_theme" aria-label="Переключить тему">
      <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="/assets/icons.svg#icon-02"></use></svg>
      <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="/assets/icons.svg#icon-03"></use></svg>
    </button>
  </div>

  <main class="lost">
    <div class="lost-core">
      <div class="lost-code" role="img" aria-label="404">
        <span aria-hidden="true">4</span>
        <svg class="sticker" aria-hidden="true"><use href="/assets/stickers.svg#s-sun"></use></svg>
        <span aria-hidden="true">4</span>
      </div>
      <h1 class="lost-title" data-i18n="404_heading">Страница не найдена</h1>
      <p class="lost-desc" data-i18n="404_description">Кажется, вы заблудились в цифровом пространстве. Страница, которую вы ищете, не существует или была перемещена.</p>
      <div class="lost-actions">
        <a class="flip" href="/" style="--flip:var(--gold)"><span class="flip-box"><span class="flip-face" data-i18n="404_home">На главную</span><span class="flip-face flip-face--alt" aria-hidden="true" data-i18n="404_home">На главную</span></span></a>
        <button class="flip" type="button" onclick="history.back()" style="--flip:var(--pink)"><span class="flip-box"><span class="flip-face" data-i18n="404_back">Назад</span><span class="flip-face flip-face--alt" aria-hidden="true" data-i18n="404_back">Назад</span></span></button>
      </div>
    </div>
  </main>
</body>
</html>
