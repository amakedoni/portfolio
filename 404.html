<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="404_title">404 — Страница не найдена | Alexander Makedonskiy</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/webp" sizes="512x512" href="/assets/images/favicon.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Pirata+One&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="/js/translations.js"></script>
  <script src="/js/lang.js"></script>
  <script src="/js/theme.js"></script>
  <style>
    :root{
      --bg:#fafafa;--bg-2:#ffffff;--bg-3:#f0f0f0;--ink:#111111;--ink-2:#555555;--ink-3:#888888;
      --line:#d0d0d0;--line-soft:#e6e6e6;--shadow-sm:3px 3px 0 1px rgba(0,0,0,.12);--shadow-md:4px 4px 0 2px rgba(0,0,0,.18);
      --display:'Pirata One', serif;--mono:'Space Mono', ui-monospace, monospace;--sans:'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      --r-sm:2px;--r-md:4px;--r-lg:6px;--r-xl:8px;--t:.3s cubic-bezier(.16,1,.3,1);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.7;min-height:100vh;overflow-x:hidden;
      transition:background-color .5s ease,color .5s ease;opacity:0;animation:fadeInBody .9s ease-out forwards;
    }
    @keyframes fadeInBody{to{opacity:1}}
    body.dark-theme{
      --bg:#0f0f0f;--bg-2:#161616;--bg-3:#1d1d1d;--ink:#f5f5f5;--ink-2:#cfcfcf;--ink-3:#9c9c9c;--line:#3a3a3a;--line-soft:#2a2a2a;
    }
    .bg-pattern{
      position:fixed;inset:0;z-index:-2;pointer-events:none;
      background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cline x1='30' y1='25' x2='30' y2='35' stroke='%23111111' stroke-width='1'/%3E%3Cline x1='25' y1='30' x2='35' y2='30' stroke='%23111111' stroke-width='1'/%3E%3C/svg%3E");
      background-size:60px 60px;opacity:.1;
    }
    body.dark-theme .bg-pattern{
      background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cline x1='30' y1='25' x2='30' y2='35' stroke='%23f5f5f5' stroke-width='1'/%3E%3Cline x1='25' y1='30' x2='35' y2='30' stroke='%23f5f5f5' stroke-width='1'/%3E%3C/svg%3E");
      opacity:.14;
    }
    .controls{position:fixed;top:20px;right:20px;display:flex;gap:12px;z-index:30}
    .icon-btn{
      width:44px;height:44px;border:2px solid var(--line);border-radius:var(--r-md);background:var(--bg-2);color:var(--ink);
      font-family:var(--mono);font-weight:700;font-size:.85rem;display:flex;align-items:center;justify-content:center;cursor:pointer;
      box-shadow:var(--shadow-sm);transition:var(--t)
    }
    .icon-btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 1px var(--ink);border-color:var(--ink)}
    .icon-btn:active{transform:scale(.98)}
    .theme-toggle{position:relative}
    .theme-toggle svg{position:absolute;transition:opacity .3s ease,transform .3s ease}
    .theme-toggle .moon-icon{opacity:1;transform:scale(1) rotate(0deg)}
    .theme-toggle .sun-icon{opacity:0;transform:scale(.7) rotate(-25deg)}
    body.dark-theme .theme-toggle .moon-icon{opacity:0;transform:scale(.7) rotate(25deg)}
    body.dark-theme .theme-toggle .sun-icon{opacity:1;transform:scale(1) rotate(0deg)}

    .page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:90px 20px 40px}
    .error-wrap{width:min(760px,100%)}
    .logo{
      font-family:var(--display);font-size:2rem;font-weight:700;text-decoration:none;display:inline-block;margin-bottom:1rem;
      background:linear-gradient(135deg,var(--ink) 0%,var(--ink-2) 50%,var(--ink) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .error-card{
      background:var(--bg-2);border:2px solid var(--line);border-radius:var(--r-xl);padding:2.2rem;
      box-shadow:var(--shadow-md);transition:var(--t)
    }
    .error-card:hover{transform:translate(-4px,-4px);box-shadow:6px 6px 0 2px var(--ink);border-color:var(--ink)}
    .meta{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-bottom:.8rem}
    .code{
      font-family:var(--display);font-weight:400;font-size:clamp(4.5rem,14vw,9rem);line-height:.9;letter-spacing:-2px;color:var(--ink);margin-bottom:.6rem
    }
    .title{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,4.5vw,3rem);line-height:1.05;color:var(--ink);margin-bottom:1rem}
    .desc{font-size:1.02rem;color:var(--ink-2);max-width:58ch}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:1.7rem}
    .btn{
      display:inline-flex;align-items:center;gap:10px;padding:1rem 1.5rem;font-family:var(--sans);font-weight:600;font-size:1rem;text-decoration:none;
      color:var(--ink);background:var(--bg-2);border:2px solid var(--ink);border-radius:var(--r-md);box-shadow:var(--shadow-md);transition:var(--t);cursor:pointer
    }
    .btn:hover{transform:translate(-4px,-4px);box-shadow:6px 6px 0 2px var(--ink)}
    .btn.primary{background:var(--ink);color:var(--bg)}
    .btn.primary:hover{box-shadow:6px 6px 0 2px var(--ink-2)}
    .btn svg{width:16px;height:16px}

    @media (max-width:768px){
      .controls{top:14px;right:14px}
      .page{padding-top:82px}
      .error-card{padding:1.5rem}
      .actions{flex-direction:column}
      .btn{justify-content:center;width:100%}
    }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>

  <div class="controls">
    <button class="icon-btn lang-toggle" data-i18n="aria_lang" aria-label="Переключить язык">
      <span class="lang-text">RU</span>
    </button>
    <button class="icon-btn theme-toggle" data-i18n="aria_theme" aria-label="Переключить тему">
      <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="/assets/icons.svg#icon-02"></use></svg>
      <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="/assets/icons.svg#icon-03"></use></svg>
    </button>
  </div>

  <main class="page">
    <div class="error-wrap">
      <a class="logo" href="/">Alexander Makedonskiy</a>
      <section class="error-card">
        <div class="meta">System message / 404</div>
        <div class="code">404</div>
        <h1 class="title" data-i18n="404_heading">Страница не найдена</h1>
        <p class="desc" data-i18n="404_description">Кажется, вы заблудились в цифровом пространстве. Страница, которую вы ищете, не существует или была перемещена.</p>
        <div class="actions">
          <a href="/" class="btn primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span data-i18n="404_home">На главную</span>
          </a>
          <button type="button" class="btn" onclick="history.back()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            <span data-i18n="404_back">Назад</span>
          </button>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
